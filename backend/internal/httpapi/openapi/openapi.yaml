openapi: 3.1.0
info:
  title: Crypto Scanner API
  version: 1.0.0
  description: |
    HTTP API for service health, cryptocurrency market analysis, and candle history.

    Live candles use the same-origin WebSocket endpoint `/api/v1/live/candles`.
    Clients exchange Telegram Mini App init data for a session token with
    `POST /api/v1/auth/session` and send `Authorization: Bearer <token>` to every
    other operation. A request rejected with `401` needs a new session.

    The client first sends `LiveCandleClientMessage` with type `authenticate` and
    the session token; the token is never placed in the URL. After `authenticated`, the
    connection accepts dynamic `subscribe` and `unsubscribe` messages and emits
    `LiveCandleServerMessage` snapshots, updates, freshness changes, acknowledgements,
    and bounded errors. One connection may switch subscriptions without reconnecting.
servers:
  - url: /
tags:
  - name: Health
  - name: Authentication
  - name: Analysis
  - name: Market Data
  - name: Favorites
  - name: Price Alerts
  - name: Administration
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Check whether the process is alive
      tags: [Health]
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: The process is running.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check whether required service dependencies are ready
      tags: [Health]
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: All required dependencies are ready.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: One or more required dependencies are unavailable.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /api/v1/auth/session:
    post:
      operationId: createSession
      summary: Exchange Telegram init data for a session token
      tags: [Authentication]
      security: [{ telegramInitData: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "201":
          description: Session created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteSession
      summary: Revoke the current session
      tags: [Authentication]
      security: [{ sessionToken: [] }]
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "204": { description: Session revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/analysis/instruments/{symbol}:
    post:
      operationId: analyzeInstrument
      summary: Analyze one active instrument
      tags: [Analysis]
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Symbol"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstrumentAnalysisRequest"
      responses:
        "200":
          description: Instrument analysis result.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentAnalysisResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/SymbolNotFound"
        "409":
          $ref: "#/components/responses/InsufficientData"
        "422":
          $ref: "#/components/responses/UnprocessableAnalysis"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/AnalysisUnavailable"
  /api/v1/analysis/market:
    post:
      operationId: analyzeMarket
      summary: Analyze active instruments in the market
      tags: [Analysis]
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketAnalysisRequest"
      responses:
        "200":
          description: Market analysis result.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketAnalysisResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "422":
          $ref: "#/components/responses/UnprocessableAnalysis"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/AnalysisUnavailable"
  /api/v1/instruments/{symbol}/candles:
    get:
      operationId: listInstrumentCandles
      summary: List a chronological page of closed candles
      tags: [Market Data]
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Symbol"
        - name: interval
          in: query
          required: true
          description: Supported Binance Spot candle interval.
          schema:
            $ref: "#/components/schemas/CandleInterval"
        - name: before
          in: query
          required: false
          description: Return candles whose open time is before this cursor.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Maximum number of candles to return.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        "200":
          description: Candle page.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandlePageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/SymbolNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/instruments/{symbol}/grid-limits:
    get:
      operationId: getInstrumentGridLimits
      summary: Get the Binance spot grid price limits of an instrument
      description: |
        Returns what a Binance spot grid bot derives its price range limits
        from: the current 5-minute average price, the symbol's percent price
        multipliers (the stricter of PERCENT_PRICE_BY_SIDE and PERCENT_PRICE),
        and its PRICE_FILTER bounds and tick size. A value is 0 when the symbol
        has no such filter. The bot accepts a lower price down to
        `max(min_price, (1 − (1 − bid_multiplier_down) × 0.85) × average_price)`
        and an upper price up to
        `min(max_price, (1 + (ask_multiplier_up − 1) × 0.85) × average_price)`.
        Without a multiplier, clients allow 50% below or above the average
        price; a `max_price` of 0 sets no maximum. Grid prices are multiples of
        `tick_size`.
      tags: [Market Data]
      security:
        - sessionToken: []
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Symbol"
      responses:
        "200":
          description: Grid limits.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GridLimitsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/SymbolNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/AnalysisUnavailable"
  /api/v1/chart/indicators:
    get:
      operationId: listChartIndicators
      summary: List the indicators charts of an interval request and how to draw them
      description: |
        Clients subscribe to live charts of the interval with each item's `type`
        and `parameters`, in this order, and draw the returned series as described
        here. The administrator configures the catalog, so it may be empty.
      tags: [Market Data]
      security: [{ sessionToken: [] }]
      parameters:
        - name: interval
          in: query
          required: true
          schema: { $ref: "#/components/schemas/CandleInterval" }
      responses:
        "200":
          description: Chart indicator catalog.
          content: { application/json: { schema: { $ref: "#/components/schemas/ChartIndicatorCatalog" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/instruments:
    get:
      operationId: listInstruments
      summary: List the active instruments
      tags: [Market Data]
      security: [{ sessionToken: [] }]
      responses:
        "200":
          description: Active instruments, by symbol.
          content: { application/json: { schema: { $ref: "#/components/schemas/InstrumentList" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/favorites:
    get:
      operationId: listFavorites
      tags: [Favorites]
      security: [{ sessionToken: [] }]
      responses:
        "200":
          description: Current user's favorites.
          content: { application/json: { schema: { $ref: "#/components/schemas/FavoritesResponse" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/favorites/{symbol}:
    put:
      operationId: addFavorite
      tags: [Favorites]
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/Symbol" }]
      responses:
        "200":
          description: Favorite state.
          content: { application/json: { schema: { $ref: "#/components/schemas/Favorite" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/SymbolNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: removeFavorite
      tags: [Favorites]
      security: [{ sessionToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Symbol" }
        - name: confirm_alerts
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "204": { description: "Favorite and, when confirmed, its alerts were removed." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/FavoriteNotFound" }
        "409": { $ref: "#/components/responses/FavoriteConflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/favorites/analysis:
    post:
      operationId: analyzeFavorites
      summary: Analyze the current user's active favorite instruments
      tags: [Favorites]
      security: [{ sessionToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarketAnalysisRequest" }
      responses:
        "200":
          description: Analysis results restricted to favorite instruments.
          content: { application/json: { schema: { $ref: "#/components/schemas/MarketAnalysisResponse" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "422": { $ref: "#/components/responses/UnprocessableAnalysis" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/AnalysisUnavailable" }
  /api/v1/instruments/{symbol}/alerts:
    get:
      operationId: listPriceAlerts
      tags: [Price Alerts]
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/Symbol" }]
      responses:
        "200":
          description: Current user's active alerts for the instrument.
          content: { application/json: { schema: { $ref: "#/components/schemas/PriceAlertsResponse" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createPriceAlert
      tags: [Price Alerts]
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/Symbol" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PriceAlertInput" } } }
      responses:
        "201":
          description: Alert created; the instrument is now a favorite.
          content: { application/json: { schema: { $ref: "#/components/schemas/PriceAlert" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/SymbolNotFound" }
        "409": { $ref: "#/components/responses/AlertConflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/alerts/{alert_id}:
    patch:
      operationId: updatePriceAlert
      tags: [Price Alerts]
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/AlertID" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PriceAlertInput" } } }
      responses:
        "200":
          description: Updated alert.
          content: { application/json: { schema: { $ref: "#/components/schemas/PriceAlert" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/AlertNotFound" }
        "409": { $ref: "#/components/responses/AlertConflict" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deletePriceAlert
      tags: [Price Alerts]
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/AlertID" }]
      responses:
        "204": { description: Alert deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/AlertNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Describe the authenticated user
      tags: [Administration]
      security: [{ sessionToken: [] }]
      responses:
        "200":
          description: Current user.
          content: { application/json: { schema: { $ref: "#/components/schemas/CurrentUser" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/admin/indicator-types:
    get:
      operationId: listIndicatorTypes
      summary: List every indicator the scanner can calculate
      description: Self-descriptions of the registered indicators, used to build the scanner indicator form.
      tags: [Administration]
      security: [{ sessionToken: [] }]
      responses:
        "200":
          description: Indicator types ordered by type.
          content: { application/json: { schema: { $ref: "#/components/schemas/IndicatorTypeCatalog" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AdministratorRequired" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/admin/scanner-indicators:
    get:
      operationId: listScannerIndicators
      summary: List the configured scanner indicators
      description: |
        Strategies can read every configured indicator. It is drawn on the
        charts of its interval when `show_in_chart` is set and shown as a market
        table column when `show_in_table` is set. Items are in display order, which orders the
        table columns and the chart indicators.
      tags: [Administration]
      security: [{ sessionToken: [] }]
      responses:
        "200":
          description: Configured indicators.
          content: { application/json: { schema: { $ref: "#/components/schemas/ScannerIndicatorList" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AdministratorRequired" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createScannerIndicator
      summary: Add a scanner indicator on one or more intervals
      description: Adds one indicator per chosen interval, all or none, at the end of the display order.
      tags: [Administration]
      security: [{ sessionToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ScannerIndicatorInput" } } }
      responses:
        "201":
          description: Added indicators, in interval request order.
          content: { application/json: { schema: { $ref: "#/components/schemas/ScannerIndicatorList" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AdministratorRequired" }
        "409": { $ref: "#/components/responses/ScannerIndicatorConflict" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteUnusedScannerIndicators
      summary: Remove every unused scanner indicator
      description: |
        Removes every indicator that no strategy reads (disabled strategies
        included) and that is shown in no market table and on no chart. Every
        other indicator stays.
      tags: [Administration]
      security: [{ sessionToken: [] }]
      responses:
        "204": { description: Unused indicators removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AdministratorRequired" }
        "409": { $ref: "#/components/responses/ScannerIndicatorInUse" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/admin/scanner-indicator-batches:
    post:
      operationId: createScannerIndicatorBatch
      summary: Add several different scanner indicators
      description: |
        Adds the indicators, all or none, at the end of the display order,
        neither shown in tables nor drawn on charts. Used to add the missing
        indicators a strategy expression reads.
      tags: [Administration]
      security: [{ sessionToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ScannerIndicatorBatch" } } }
      responses:
        "201":
          description: Added indicators, in request order.
          content: { application/json: { schema: { $ref: "#/components/schemas/ScannerIndicatorList" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AdministratorRequired" }
        "409": { $ref: "#/components/responses/ScannerIndicatorConflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/admin/scanner-indicator-order:
    put:
      operationId: reorderScannerIndicators
      summary: Set the display order of the scanner indicators
      tags: [Administration]
      security: [{ sessionToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ScannerIndicatorOrder" } } }
      responses:
        "200":
          description: Indicators in the new order.
          content: { application/json: { schema: { $ref: "#/components/schemas/ScannerIndicatorList" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AdministratorRequired" }
        "404": { $ref: "#/components/responses/ScannerIndicatorNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/admin/scanner-indicators/{indicator_id}:
    patch:
      operationId: updateScannerIndicator
      summary: Change the table visibility and pane scale of a scanner indicator
      tags: [Administration]
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ScannerIndicatorID" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ScannerIndicatorUpdate" } } }
      responses:
        "200":
          description: Updated indicator.
          content: { application/json: { schema: { $ref: "#/components/schemas/ScannerIndicator" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AdministratorRequired" }
        "404": { $ref: "#/components/responses/ScannerIndicatorNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteScannerIndicator
      summary: Remove a scanner indicator
      description: Rejected while a strategy reads the indicator.
      tags: [Administration]
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ScannerIndicatorID" }]
      responses:
        "204": { description: Indicator removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AdministratorRequired" }
        "404": { $ref: "#/components/responses/ScannerIndicatorNotFound" }
        "409": { $ref: "#/components/responses/ScannerIndicatorInUse" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/admin/users:
    get:
      operationId: listUsers
      summary: List the application users
      description: Users are added through the Telegram bot. The administrator comes first.
      tags: [Administration]
      security: [{ sessionToken: [] }]
      responses:
        "200":
          description: Application users.
          content: { application/json: { schema: { $ref: "#/components/schemas/UserList" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AdministratorRequired" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/admin/users/{telegram_id}:
    patch:
      operationId: updateUser
      summary: Choose whether a user receives strategy alerts
      description: The administrator always receives them and cannot be changed.
      tags: [Administration]
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/TelegramID" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UserUpdate" } } }
      responses:
        "204": { description: User updated. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AdministratorRequired" }
        "404": { $ref: "#/components/responses/UserNotFound" }
        "409": { $ref: "#/components/responses/AdministratorProtected" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteUser
      summary: Delete an application user
      description: The user loses access, and their favorites and price alerts are deleted. The administrator cannot be deleted.
      tags: [Administration]
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/TelegramID" }]
      responses:
        "204": { description: User deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AdministratorRequired" }
        "404": { $ref: "#/components/responses/UserNotFound" }
        "409": { $ref: "#/components/responses/AdministratorProtected" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/admin/strategy-variables:
    get:
      operationId: listStrategyVariables
      summary: List the indicator values strategy expressions can read
      description: One variable per output of every configured indicator, in display order.
      tags: [Administration]
      security: [{ sessionToken: [] }]
      responses:
        "200":
          description: Strategy variables.
          content: { application/json: { schema: { $ref: "#/components/schemas/StrategyVariableList" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AdministratorRequired" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/admin/strategy-symbols:
    get:
      operationId: listStrategySymbols
      summary: List the coins strategy expressions can read through of
      description: The active coins in the administrator's favorites, ascending.
      tags: [Administration]
      security: [{ sessionToken: [] }]
      responses:
        "200":
          description: Strategy symbols.
          content: { application/json: { schema: { $ref: "#/components/schemas/StrategySymbolList" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AdministratorRequired" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/admin/strategy-validations:
    post:
      operationId: validateStrategy
      summary: Check a strategy expression
      description: |
        Lists every problem that would reject the expression as the entry
        rule of a strategy, or as its exit rule when `exit` is set, which may
        also read the position variables: syntax, unknown indicators, candle fields, and functions, history
        depth, and coins read through `of` that are not active coins in the
        administrator's favorites. Variables of indicators that are not
        configured are resolved from their names into `missing_indicators`
        when exactly one indicator has the name. Strategies read them without
        adding them, so no problems mean the expression is valid.
      tags: [Administration]
      security: [{ sessionToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StrategyValidationInput" } } }
      responses:
        "200":
          description: Problems of the expression.
          content: { application/json: { schema: { $ref: "#/components/schemas/StrategyValidation" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AdministratorRequired" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/admin/strategies:
    get:
      operationId: listStrategies
      summary: List the strategies
      description: |
        Enabled strategies trade the administrator's favorites on the closed
        candles of the finest interval their rules read. An entry signal is
        the entry rule turning from false to true. A strategy that exits,
        through an exit rule, a take profit, or a stop loss, holds one buy per
        trade: a signal opens a trade, fixing its take profit and stop loss
        prices at the signal's close, and signals during the trade buy
        nothing. A strategy without exits buys at every signal and never
        sells. A candle reaching the stop loss or the take profit sells the
        trade there, the stop loss first when it reaches both; the exit rule
        being true sells it at the next open. A sell counts the entry as
        false on its candle. A strategy trades in its `direction`, long or
        short; a short strategy opens a short position instead of buying,
        always has a take profit below and a stop loss above the close, and
        closes when the price rises to the stop loss or falls to the take
        profit. A strategy with `signal` true is a signal instead: it has no
        exits, buys nothing, and only announces its entry signals with the
        move its `direction` expects, which may also be sideways, on the
        coins within its market cap range. The administrator and users with strategy alerts get a
        Telegram message for every buy, sell, short, cover, and signal.
      tags: [Administration]
      security: [{ sessionToken: [] }]
      responses:
        "200":
          description: Strategies ordered by creation.
          content: { application/json: { schema: { $ref: "#/components/schemas/StrategyList" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AdministratorRequired" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createStrategy
      summary: Add a strategy
      description: An enabled strategy announces the instruments whose entry is true now, then signals buys and sells.
      tags: [Administration]
      security: [{ sessionToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StrategyInput" } } }
      responses:
        "201":
          description: Added strategy.
          content: { application/json: { schema: { $ref: "#/components/schemas/Strategy" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AdministratorRequired" }
        "409": { $ref: "#/components/responses/StrategyConflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/admin/strategies/{strategy_id}:
    put:
      operationId: updateStrategy
      summary: Change a strategy
      description: A change of how an enabled strategy trades forgets its open trades and starts it afresh.
      tags: [Administration]
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/StrategyID" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StrategyUpdate" } } }
      responses:
        "200":
          description: Updated strategy.
          content: { application/json: { schema: { $ref: "#/components/schemas/Strategy" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AdministratorRequired" }
        "404": { $ref: "#/components/responses/StrategyNotFound" }
        "409": { $ref: "#/components/responses/StrategyConflict" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      operationId: setStrategyEnabled
      summary: Turn a strategy on or off
      description: Enabling starts the strategy afresh, without trades; disabling forgets its trades.
      tags: [Administration]
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/StrategyID" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StrategyEnabled" } } }
      responses:
        "200":
          description: Updated strategy.
          content: { application/json: { schema: { $ref: "#/components/schemas/Strategy" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AdministratorRequired" }
        "404": { $ref: "#/components/responses/StrategyNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteStrategy
      summary: Remove a strategy
      tags: [Administration]
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/StrategyID" }]
      responses:
        "204": { description: Strategy removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AdministratorRequired" }
        "404": { $ref: "#/components/responses/StrategyNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/admin/strategies/{strategy_id}/backtest:
    get:
      operationId: backtestStrategy
      summary: Backtest a saved strategy on one coin
      description: |
        Evaluates the saved strategy, enabled or not, at the close of every
        stored candle of the finest interval its rules read, and replays its
        trades exactly as live signals trade, starting without a trade. Any active coin can be
        backtested; coins read through `of` must be in the administrator's
        favorites, otherwise their values are unknown. Only the stored closed
        history is replayed (up to 20,000 candles; the administrator loads
        deeper history with `POST /api/v1/admin/candle-history-loads`,
        backtests never load it); when older candles may be missing, candles
        before the full indicator warm-up are not evaluated.

        Every buy spends the same amount at the open of the candle after its
        signal. A take profit or stop loss sells every buy of the trade at its
        price on the candle that reaches it, or at that candle's open when it
        opens past it; an exit rule sells at the open of the candle after its
        signal. Both sides pay `fee`. A trade still open when the history
        ends is valued at the last close. `from` and `to` limit the evaluated
        candles by open time; older candles still warm the indicators up. Two baselines
        cover the same evaluated period of a long strategy: buying and
        holding, and buying the same amount at every candle (DCA). A short
        strategy sells at entry and buys back at exit, gaining as the price
        falls; funding, leverage, and liquidation are not modeled, and it has
        no baselines. A backtest that does not finish
        within its time limit fails with `backtest_too_heavy`.

        A signal trades nothing: its backtest has no trades and no baselines,
        and `signal` lists its entry signals and how the price moved after
        them.
      tags: [Administration]
      security: [{ sessionToken: [] }]
      parameters:
        - $ref: "#/components/parameters/StrategyID"
        - name: symbol
          in: query
          required: true
          description: Market symbol of the replayed coin.
          schema: { $ref: "#/components/schemas/BacktestSymbolName" }
        - name: from
          in: query
          required: false
          description: Earliest open time of an evaluated candle; the start of the stored history when absent.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: Latest open time of an evaluated candle, not before `from`; the end of the stored history when absent.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Simulated trades and their metrics.
          content: { application/json: { schema: { $ref: "#/components/schemas/StrategyBacktest" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AdministratorRequired" }
        "404":
          description: The strategy does not exist, or the symbol is unknown or inactive.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/BacktestTooHeavy" }
  /api/v1/admin/candle-history-loads:
    post:
      operationId: startCandleHistoryLoad
      summary: Start loading deeper candle history
      description: |
        Starts a background job that extends the stored closed history of
        each coin on each interval backwards to `depth` candles, or to the
        oldest candle Binance has, and returns at once. Synchronization keeps
        only the latest 2,000 candles complete; deeper candles serve backtests
        and stay until the retention pruner removes those beyond 20,000.
        Histories already deep enough cost nothing, and a history that
        synchronization has not filled yet is skipped as `not_ready` while
        the job goes on. Pages are fetched at most
        one per second, so a first hourly load to 20,000 candles takes about
        20 seconds per coin. One job runs at a time; follow it with
        `GET /api/v1/admin/candle-history-loads`. Only the administrator
        starts loads, from the Mini App: requests authenticated with an API
        token are refused (`session_required`). Backtests never load history.
      tags: [Administration]
      security: [{ sessionToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CandleHistoryLoadInput" } } }
      responses:
        "202":
          description: The started job.
          content: { application/json: { schema: { $ref: "#/components/schemas/CandleHistoryLoadJob" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "404": { $ref: "#/components/responses/SymbolNotFound" }
        "409": { $ref: "#/components/responses/HistoryLoadRunning" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      operationId: getCandleHistoryLoad
      summary: Show the current or last history load
      description: |
        The running job, or the last one since the server started; jobs are
        kept in memory only, so a restart forgets them and stops a running
        one.
      tags: [Administration]
      security: [{ sessionToken: [] }]
      responses:
        "200":
          description: The current or last job.
          content: { application/json: { schema: { $ref: "#/components/schemas/CandleHistoryLoadJob" } } }
        "204": { description: No job ran since the server started. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AdministratorRequired" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/admin/api-tokens:
    get:
      operationId: listApiTokens
      summary: List the administrator's API tokens
      description: |
        Newest first. A deleted token is no longer listed. API tokens are
        managed only from the Mini App: requests authenticated with an API
        token are refused (`session_required`).
      tags: [Administration]
      security: [{ sessionToken: [] }]
      responses:
        "200":
          description: API tokens without their secrets.
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiTokenList" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createApiToken
      summary: Issue an API token
      description: |
        Issues a token for clients other than the Mini App, such as the scanner
        CLI. It authenticates as a session of the calling administrator, with
        the same rights, except managing API tokens and starting history
        loads (`session_required`), until it is deleted; it does not expire.
        The token is returned only in this response; only its hash is stored.
        Only a Mini App session issues tokens.
      tags: [Administration]
      security: [{ sessionToken: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ApiTokenInput" } } }
      responses:
        "201":
          description: Issued token.
          content: { application/json: { schema: { $ref: "#/components/schemas/IssuedApiToken" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/admin/api-tokens/{token_id}:
    delete:
      operationId: deleteApiToken
      summary: Revoke an API token
      description: The token stops authenticating immediately. Only a Mini App session revokes tokens (`session_required`).
      tags: [Administration]
      security: [{ sessionToken: [] }]
      parameters: [{ $ref: "#/components/parameters/ApiTokenID" }]
      responses:
        "204": { description: Token revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/SessionRequired" }
        "404": { $ref: "#/components/responses/ApiTokenNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
components:
  securitySchemes:
    telegramInitData:
      type: apiKey
      in: header
      name: Authorization
      description: Telegram Mini App init data prefixed with `tma `; accepted only by `createSession`.
    sessionToken:
      type: http
      scheme: bearer
      description: Session token issued by `createSession`, or an API token (`cst_…`) issued by `createApiToken`.
  parameters:
    ApiTokenID:
      name: token_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: Optional caller-provided correlation ID. Unsafe values are replaced.
      schema:
        type: string
    Symbol:
      name: symbol
      in: path
      required: true
      description: Market symbol.
      schema:
        type: string
        minLength: 1
        maxLength: 32
    AlertID:
      name: alert_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ScannerIndicatorID:
      name: indicator_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    StrategyID:
      name: strategy_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    TelegramID:
      name: telegram_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  headers:
    RequestID:
      description: Correlation ID assigned to the request.
      required: true
      schema:
        type: string
  responses:
    ApiTokenNotFound:
      description: The administrator has no such API token.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    UserNotFound:
      description: The user does not exist.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    AdministratorProtected:
      description: The administrator cannot be deleted and always receives strategy alerts.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    BadRequest:
      description: The request is malformed or contains an unsupported argument.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: The session or Telegram init data is missing, invalid, or expired.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AccessDenied:
      description: The authenticated Telegram user has no access.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SymbolNotFound:
      description: The symbol is unknown or inactive.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InsufficientData:
      description: The requested analysis requires more candle history.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableAnalysis:
      description: An instrument could not be resolved for analysis.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: An unexpected server error occurred.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    FavoriteNotFound:
      description: Favorite is not owned by the current user.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    AlertNotFound:
      description: Alert is not owned by the current user.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    FavoriteConflict:
      description: |
        `favorite_has_alerts`: confirmation is required because alerts exist
        (`details.alert_count`). `instrument_used_by_strategy`: the
        administrator's favorite is a coin strategies read through `of`
        (`details.uses`, see `InstrumentUses`).
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    AlertConflict:
      description: Duplicate target or per-instrument alert limit.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    AdministratorRequired:
      description: The user has no access or is not the scanner administrator.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    ScannerIndicatorNotFound:
      description: The scanner indicator does not exist.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    ScannerIndicatorConflict:
      description: The interval already has this indicator or its charts draw the maximum number of indicators.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    ScannerIndicatorInUse:
      description: A strategy reads the indicator.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    StrategyNotFound:
      description: The strategy does not exist.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    StrategyConflict:
      description: Another strategy has the name.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    BacktestTooHeavy:
      description: The backtest did not finish within its time limit (`backtest_too_heavy`).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    SessionRequired:
      description: The user is not the scanner administrator (`administrator_required`), or authenticated with an API token instead of a Mini App session (`session_required`).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    HistoryLoadRunning:
      description: Another history load is running (`history_load_running`).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    AnalysisUnavailable:
      description: Required market data or market-capitalization data is unavailable.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ApiTokenInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Where the token is used, such as `laptop CLI`. Surrounding whitespace is trimmed; a blank name is rejected.
    ApiTokenList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ApiToken" }
    ApiToken:
      type: object
      additionalProperties: false
      required: [id, name, created_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at:
          type: string
          format: date-time
          description: Last authenticated request, recorded at most once a minute; absent until the first use.
    IssuedApiToken:
      type: object
      additionalProperties: false
      required: [id, name, created_at, token]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        created_at: { type: string, format: date-time }
        token:
          type: string
          description: Bearer token starting with `cst_`. It is shown only once.
    Session:
      type: object
      additionalProperties: false
      required: [token, expires_at]
      properties:
        token:
          type: string
          description: Opaque bearer token; it also expires after a period without use.
        expires_at:
          type: string
          format: date-time
          description: Time after which the session ends regardless of use.
    Favorite:
      type: object
      additionalProperties: false
      required: [symbol, base_asset, quote_asset, active, alert_count, created_at]
      properties:
        symbol: { type: string }
        base_asset: { type: string }
        quote_asset: { type: string }
        active: { type: boolean }
        alert_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
    InstrumentList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/InstrumentListItem" } }
    InstrumentListItem:
      type: object
      additionalProperties: false
      required: [symbol]
      properties:
        symbol: { type: string }
    FavoritesResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Favorite" } }
    PriceAlertInput:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target:
          type: string
          pattern: '^(0|[1-9][0-9]{0,19})(\.[0-9]{1,18})?$'
          maxLength: 39
    PriceAlert:
      type: object
      additionalProperties: false
      required: [id, symbol, target, version, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        symbol: { type: string }
        target: { type: string }
        version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PriceAlertsResponse:
      type: object
      additionalProperties: false
      required: [items, count, limit]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PriceAlert" } }
        count: { type: integer, minimum: 0 }
        limit: { type: integer, const: 10 }
    LivenessResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          additionalProperties: false
          required: [database, migrations, market_sync]
          properties:
            database:
              $ref: "#/components/schemas/ReadinessCheck"
            migrations:
              $ref: "#/components/schemas/ReadinessCheck"
            market_sync:
              $ref: "#/components/schemas/ReadinessCheck"
    ReadinessCheck:
      type: string
      enum: [ok, unavailable, missing]
    InstrumentAnalysisRequest:
      x-go-name: InstrumentAnalysisRequest
      type: object
      additionalProperties: false
      required: [criteria]
      properties:
        criteria:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: "#/components/schemas/CriterionRequest"
    MarketAnalysisRequest:
      x-go-name: MarketAnalysisRequest
      type: object
      additionalProperties: false
      required: [criteria]
      properties:
        criteria:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: "#/components/schemas/CriterionRequest"
        limit:
          description: Maximum instruments to select. Zero or omission means no limit.
          type: integer
          minimum: 0
          maximum: 100
        sort:
          $ref: "#/components/schemas/MarketSort"
    CriterionRequest:
      type: object
      additionalProperties: false
      required: [key, name, label, parameters]
      properties:
        key:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 64
        label:
          type: string
          maxLength: 128
        parameters:
          type: object
          maxProperties: 16
          additionalProperties: true
    MarketSort:
      type: object
      additionalProperties: false
      required: [field, direction]
      properties:
        field:
          type: string
          enum: [market_cap_usd]
        direction:
          type: string
          enum: [asc, desc]
    Evaluation:
      type: object
      additionalProperties: false
      required: [key, name, label, matched, metrics, candle_count, from, to]
      properties:
        key:
          type: string
        name:
          type: string
        label:
          type: string
        matched:
          type: boolean
        metrics:
          type: object
          additionalProperties:
            type: number
            format: double
        candle_count:
          type: integer
          minimum: 0
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    Warning:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    InstrumentAnalysisResponse:
      type: object
      additionalProperties: false
      required: [symbol, matched, evaluations, warnings]
      properties:
        symbol:
          type: string
        matched:
          type: boolean
        evaluations:
          type: array
          items:
            $ref: "#/components/schemas/Evaluation"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
    PriceHistoryWindow:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    MarketAnalysisItem:
      type: object
      additionalProperties: false
      required: [symbol, matched, evaluations]
      properties:
        symbol:
          type: string
        matched:
          type: boolean
        evaluations:
          type: array
          items:
            $ref: "#/components/schemas/Evaluation"
    MarketTable:
      description: |
        The table clients render for an analysis, as configured by the backend:
        columns in display order, how each cell is shown, which columns are
        sortable, and the default sort. Columns that show criterion results read
        them by criterion and candle unit, independent of criterion keys.
      type: object
      additionalProperties: false
      required: [columns, default_sort, rows]
      properties:
        columns:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TableColumn"
        default_sort:
          $ref: "#/components/schemas/TableSort"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/TableRow"
    TableColumn:
      type: object
      additionalProperties: false
      required: [id, title, kind, sortable]
      properties:
        id:
          type: string
        title:
          type: string
        kind:
          $ref: "#/components/schemas/TableColumnKind"
        sortable:
          description: Sortable columns are numeric and sorted by the cell `value`.
          type: boolean
    TableColumnKind:
      description: |
        How a cell is rendered and which cell field it reads. `text` and
        `favorite` use the row symbol; `sparkline` reads `series` over the
        response `price_history_window`; `link` reads `url`; every other kind
        reads `value`.
      type: string
      enum: [text, usd_compact, range_percent, oscillator, percent_change, sparkline, link, favorite, count, number]
    TableSort:
      type: object
      additionalProperties: false
      required: [column, direction]
      properties:
        column:
          type: string
        direction:
          type: string
          enum: [asc, desc]
    TableRow:
      type: object
      additionalProperties: false
      required: [symbol, cells]
      properties:
        symbol:
          type: string
        cells:
          description: Cells keyed by column id. Columns of kind `text` and `favorite` have no cell.
          type: object
          additionalProperties:
            $ref: "#/components/schemas/TableCell"
    TableCell:
      description: Holds the field its column kind reads; the field is omitted when its value is unavailable.
      type: object
      additionalProperties: false
      properties:
        value:
          type: number
          format: double
        series:
          type: array
          minItems: 169
          maxItems: 169
          items:
            type: [number, "null"]
            format: double
        url:
          type: string
    UnresolvedInstrument:
      type: object
      additionalProperties: false
      required: [symbol, code, message]
      properties:
        symbol:
          type: string
        code:
          type: string
          enum: [mapping_conflict, mapping_not_found, mapping_provider_unavailable, market_cap_missing]
        message:
          type: string
    InsufficientDataInstrument:
      description: An instrument skipped because a criterion lacked closed candle history.
      type: object
      additionalProperties: false
      required: [symbol, unit, required, available]
      properties:
        symbol:
          type: string
        unit:
          type: string
          enum: [days, hours]
        required:
          type: integer
          minimum: 1
        available:
          type: integer
          minimum: 0
    MarketAnalysisResponse:
      type: object
      additionalProperties: false
      required:
        - price_history_window
        - matched_count
        - analyzed_count
        - insufficient_data_count
        - insufficient_data
        - items
        - unresolved
        - warnings
        - table
      properties:
        table:
          $ref: "#/components/schemas/MarketTable"
        price_history_window:
          $ref: "#/components/schemas/PriceHistoryWindow"
        matched_count:
          type: integer
          minimum: 0
        analyzed_count:
          type: integer
          minimum: 0
        insufficient_data_count:
          type: integer
          minimum: 0
        insufficient_data:
          type: array
          items:
            $ref: "#/components/schemas/InsufficientDataInstrument"
        items:
          type: array
          items:
            $ref: "#/components/schemas/MarketAnalysisItem"
        unresolved:
          type: array
          items:
            $ref: "#/components/schemas/UnresolvedInstrument"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
    CandleInterval:
      type: string
      enum: [1h, 1d, 1w, 1M]
    Candle:
      type: object
      additionalProperties: false
      required: [open_time, close_time, open, high, low, close, volume, quote_asset_volume, trade_count]
      properties:
        open_time:
          type: string
          format: date-time
        close_time:
          type: string
          format: date-time
        open:
          type: number
          format: double
        high:
          type: number
          format: double
        low:
          type: number
          format: double
        close:
          type: number
          format: double
        volume:
          type: number
          format: double
        quote_asset_volume:
          type: number
          format: double
        trade_count:
          type: integer
          format: int64
          minimum: 0
    CandlePageResponse:
      type: object
      additionalProperties: false
      required: [symbol, interval, candles, has_more]
      properties:
        symbol:
          type: string
        interval:
          $ref: "#/components/schemas/CandleInterval"
        candles:
          type: array
          items:
            $ref: "#/components/schemas/Candle"
        has_more:
          type: boolean
        next_before:
          type: [string, "null"]
          format: date-time
    GridLimitsResponse:
      type: object
      additionalProperties: false
      required: [symbol, average_price, bid_multiplier_down, ask_multiplier_up, min_price, max_price, tick_size]
      properties:
        symbol:
          type: string
        average_price:
          type: number
          format: double
          exclusiveMinimum: 0
        bid_multiplier_down:
          type: number
          format: double
          minimum: 0
        ask_multiplier_up:
          type: number
          format: double
          minimum: 0
        min_price:
          type: number
          format: double
          minimum: 0
        max_price:
          type: number
          format: double
          minimum: 0
        tick_size:
          type: number
          format: double
          minimum: 0
    IndicatorConfig:
      type: object
      additionalProperties: false
      required: [type, parameters]
      properties:
        type:
          type: string
          minLength: 1
        parameters:
          type: object
          additionalProperties: true
    IndicatorPoint:
      type: object
      additionalProperties: false
      required: [time, value]
      properties:
        time:
          type: string
          format: date-time
        value:
          type: number
          format: double
    IndicatorSeries:
      type: object
      additionalProperties: false
      required: [name, points]
      properties:
        name:
          type: string
        points:
          type: array
          items:
            $ref: "#/components/schemas/IndicatorPoint"
    ChartIndicatorResult:
      type: object
      additionalProperties: false
      required: [type, parameters, series]
      properties:
        type:
          type: string
        parameters:
          type: object
          additionalProperties: true
        series:
          type: array
          items:
            $ref: "#/components/schemas/IndicatorSeries"
    ChartIndicatorCatalog:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ChartIndicatorDefinition" }
    ChartIndicatorDefinition:
      type: object
      additionalProperties: false
      required: [id, type, parameters, placement, lines]
      properties:
        id:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
        parameters:
          type: object
          additionalProperties: true
        placement:
          type: string
          enum: [overlay, pane]
          description: "`overlay` draws over the candles on their price scale; `pane` draws in a pane below."
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ChartIndicatorLine" }
        scale:
          $ref: "#/components/schemas/ChartIndicatorScale"
        pane:
          type: string
          minLength: 1
          description: Key of the pane a `pane` indicator is drawn in; indicators with the same key share one pane. Absent for overlays.
    ChartIndicatorLine:
      type: object
      additionalProperties: false
      required: [output, title, color]
      properties:
        output:
          type: string
          description: Name of the calculated series drawn by this line.
        title:
          type: string
        color:
          type: string
          description: Client theme color token, for example `yellow.5`.
    ChartIndicatorScale:
      type: object
      additionalProperties: false
      required: [levels]
      description: Value axis of a pane indicator; clients derive the value precision from the values.
      properties:
        min:
          type: number
          format: double
        max:
          type: number
          format: double
        levels:
          type: array
          items: { $ref: "#/components/schemas/ChartIndicatorLevel" }
    ChartIndicatorLevel:
      type: object
      additionalProperties: false
      required: [value, title]
      properties:
        value:
          type: number
          format: double
        title:
          type: string
    ChartPageResponse:
      type: object
      additionalProperties: false
      required: [symbol, interval, candles, indicators, has_more]
      properties:
        symbol:
          type: string
        interval:
          $ref: "#/components/schemas/CandleInterval"
        candles:
          type: array
          items:
            $ref: "#/components/schemas/Candle"
        indicators:
          type: array
          items:
            $ref: "#/components/schemas/ChartIndicatorResult"
        has_more:
          type: boolean
        next_before:
          type: [string, "null"]
          format: date-time
    LiveCandleClientMessage:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [authenticate, subscribe, unsubscribe]
        token:
          type: string
          minLength: 1
          description: Session token of an `authenticate` message.
        symbol:
          type: string
          minLength: 1
          maxLength: 32
        interval:
          $ref: "#/components/schemas/CandleInterval"
        limit:
          type: integer
          minimum: 1
          maximum: 2000
          description: Closed-candle range for this chart subscription; subscribing again with a larger value extends the range.
        indicators:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/IndicatorConfig"
    LiveCandleServerMessage:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [authenticated, subscribed, unsubscribed, snapshot, update, status, error]
        symbol:
          type: string
        interval:
          $ref: "#/components/schemas/CandleInterval"
        chart:
          description: >-
            In a snapshot, the complete closed-candle range plus the current candle,
            with indicators calculated over the entire range. In an update, only the
            current candle and indicator points from its open time; it applies solely
            on top of the message with the preceding version.
          $ref: "#/components/schemas/ChartPageResponse"
        version:
          type: integer
          format: int64
          description: Increases by one with every snapshot or update of this subscription.
        freshness:
          type: string
          enum: [waiting, fresh, stale, recovering]
        code:
          type: string
          enum: [unauthenticated, access_denied, invalid_message, invalid_argument, symbol_not_found, rate_limited, subscription_limit, unavailable, slow_client]
        message:
          type: string
    APIError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - access_denied
            - administrator_protected
            - administrator_required
            - alert_limit
            - alert_not_found
            - api_token_not_found
            - backtest_too_heavy
            - duplicate_target
            - favorite_has_alerts
            - favorite_not_found
            - history_load_running
            - instrument_used_by_strategy
            - insufficient_data
            - internal_error
            - invalid_argument
            - mapping_conflict
            - mapping_not_found
            - mapping_provider_unavailable
            - market_cap_missing
            - market_cap_unavailable
            - market_data_unavailable
            - scanner_indicator_exists
            - scanner_indicator_in_use
            - scanner_indicator_limit
            - scanner_indicator_not_found
            - session_required
            - strategy_exists
            - strategy_not_found
            - symbol_not_found
            - unauthenticated
            - user_not_found
        message:
          type: string
        details: {}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, request_id]
      properties:
        error:
          $ref: "#/components/schemas/APIError"
        request_id:
          type: string
    CurrentUser:
      type: object
      additionalProperties: false
      required: [administrator]
      properties:
        administrator:
          type: boolean
          description: Whether the user manages the global scanner settings.
    UserList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/User" }
    User:
      type: object
      additionalProperties: false
      required: [telegram_id, administrator, strategy_alerts]
      properties:
        telegram_id: { type: integer, format: int64 }
        username: { type: string }
        display_name: { type: string }
        administrator:
          type: boolean
          description: Whether the user is the scanner administrator, who cannot be deleted.
        strategy_alerts:
          type: boolean
          description: Whether the user receives strategy alerts; always true for the administrator.
    UserUpdate:
      type: object
      additionalProperties: false
      required: [strategy_alerts]
      properties:
        strategy_alerts: { type: boolean }
    StrategyVariableList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StrategyVariable" }
    StrategySymbolList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { type: string }
    InstrumentUses:
      type: object
      additionalProperties: false
      required: [uses]
      description: Details of `instrument_used_by_strategy`.
      properties:
        uses:
          type: array
          items: { $ref: "#/components/schemas/InstrumentUse" }
    InstrumentUse:
      type: object
      additionalProperties: false
      required: [symbol, strategies]
      properties:
        symbol: { type: string }
        strategies:
          type: array
          items: { type: string }
          description: Names of the strategies that read the coin.
    StrategyVariable:
      type: object
      additionalProperties: false
      required: [name, label, position]
      properties:
        name:
          type: string
          description: CEL identifier, such as `d_rsi`, `h_macd_macdsignal`, the candle field `h_close`, or the position variable `pnl`.
        label:
          type: string
          description: Indicator title and output, such as `d-rsi` or `h-macd macdsignal`, the candle field, such as `h-close`, or the position variable, such as `pnl`.
        indicator_id:
          type: integer
          format: int64
          description: The indicator the variable reads; absent for candle fields, which every interval has, and position variables.
        interval:
          $ref: "#/components/schemas/CandleInterval"
          description: Interval of the value; absent for position variables.
        position:
          type: boolean
          description: |
            True for the variables of the open trade, which only exit rules
            read and only at the latest candle: `entry_price`, the average
            price of its buys; `pnl`, its return at the close before fees in
            percent, such as 5 for 5%; and `bars_held`, the candles since its first buy
            filled, counting the candle it filled at.
    StrategyList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Strategy" }
    Strategy:
      type: object
      additionalProperties: false
      required: [id, name, signal, direction, expression, exit_expression, take_profit_expression, stop_loss_expression, min_market_cap_usd, max_market_cap_usd, target_ratio, window, message, enabled, valid, missing_indicators]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        signal: { $ref: "#/components/schemas/StrategySignal" }
        direction: { $ref: "#/components/schemas/Direction" }
        expression:
          type: string
          description: Entry rule, a CEL expression such as `d_rsi > 50 && crosses_above(h_ema_20, h_ema_50)`.
        exit_expression: { $ref: "#/components/schemas/StrategyExitExpression" }
        take_profit_expression: { $ref: "#/components/schemas/StrategyTakeProfitExpression" }
        stop_loss_expression: { $ref: "#/components/schemas/StrategyStopLossExpression" }
        min_market_cap_usd: { $ref: "#/components/schemas/StrategyMarketCapBound" }
        max_market_cap_usd: { $ref: "#/components/schemas/StrategyMarketCapBound" }
        target_ratio:
          oneOf:
            - $ref: "#/components/schemas/SignalTargetRatio"
            - type: "null"
        window:
          oneOf:
            - $ref: "#/components/schemas/SignalWindow"
            - type: "null"
        message: { $ref: "#/components/schemas/StrategyMessage" }
        enabled: { type: boolean }
        valid:
          type: boolean
          description: False when a stored rule no longer compiles; such a strategy is not evaluated.
        problem:
          type: string
          description: Why a stored rule no longer compiles; present only when valid is false.
        missing_indicators:
          type: array
          description: |
            Indicators the rules read that are not configured, in reading
            order. The strategy reads them all the same; the builder shows
            the rules only once they are added.
          items: { $ref: "#/components/schemas/StrategyMissingIndicator" }
    StrategyBacktest:
      type: object
      additionalProperties: false
      required: [interval, symbol, direction, fee, from, to, summary, trades, skipped_alerts, equity, baselines, signal]
      description: Returns, drawdowns, moves, and fees are fractions, such as 0.012 for 1.2%.
      properties:
        interval:
          $ref: "#/components/schemas/CandleInterval"
        symbol: { type: string }
        direction: { $ref: "#/components/schemas/Direction" }
        fee:
          type: number
          format: double
          description: Fee paid on entry and again on exit, as a fraction of the traded value.
        from:
          type: [string, "null"]
          format: date-time
          description: Open time of the first evaluated candle of the interval; null when none is evaluated.
        to:
          type: [string, "null"]
          format: date-time
          description: Open time of the last evaluated candle of the interval; null when none is evaluated.
        summary: { $ref: "#/components/schemas/BacktestSummary" }
        trades:
          type: array
          description: Trades, oldest first; the last one is open when the history ends before its sell.
          items: { $ref: "#/components/schemas/BacktestTrade" }
        skipped_alerts:
          type: integer
          description: Entry signals that bought nothing, since a strategy that exits held a trade, or the take profit or stop loss was not on its side of the close.
        equity:
          type: array
          description: Equity after each trade, the open one included, compounded from 1, oldest first.
          items: { $ref: "#/components/schemas/BacktestEquityPoint" }
        baselines: { $ref: "#/components/schemas/BacktestBaselines" }
        signal:
          oneOf:
            - $ref: "#/components/schemas/BacktestSignal"
            - type: "null"
          description: The entry signals of a signal judged by a target and a stop; null for a trading strategy.
    BacktestSignal:
      type: object
      additionalProperties: false
      required: [window, target_ratio, occurrences, evaluated, signals, all]
      description: |
        Judges each signal candle's close, and every evaluated candle's
        alike, by a stop and a target over the window candles after it. The
        stop lies the usual price move over the window away against the
        expected move: the sample standard deviation of the 100 one-candle
        returns up to the candle times the square root of the window. The
        target lies target_ratio stops away in the expected direction; a
        sideways signal has a target on both sides and no stop. Outcomes may
        read stored candles after the evaluated period.
      properties:
        window:
          type: integer
          minimum: 1
          description: Candles after the signal candle that are judged.
        target_ratio:
          type: integer
          minimum: 1
          description: Target distance in stops.
        occurrences:
          type: array
          description: Entry signals, oldest first.
          items: { $ref: "#/components/schemas/BacktestSignalOccurrence" }
        evaluated:
          type: integer
          minimum: 0
          description: Entry signals with an evaluation.
        signals:
          $ref: "#/components/schemas/BacktestSignalStats"
          description: The counted entry signals, each at least a window after the previous counted one.
        all:
          $ref: "#/components/schemas/BacktestSignalStats"
          description: Every evaluated candle with an evaluation.
    BacktestSignalOccurrence:
      type: object
      additionalProperties: false
      required: [time, close, values, counted, stop, target, move, success]
      description: |
        An entry signal. counted, stop, target, move, and success are null
        together when the stored history lacks the 100 earlier returns or the
        window after the signal, without gaps.
      properties:
        time:
          type: string
          format: date-time
          description: Open time of the candle whose close signaled.
        close: { type: number, format: double }
        values:
          $ref: "#/components/schemas/BacktestValues"
          description: What the entry rule read at the signal.
        counted:
          type: [boolean, "null"]
          description: Whether the statistics count the signal; a signal within a window after the previous counted one is a repeat.
        stop:
          type: [number, "null"]
          format: double
          description: Stop distance from the close; null for sideways.
        target:
          type: [number, "null"]
          format: double
          description: Target distance from the close, on both sides for sideways.
        move:
          type: [number, "null"]
          format: double
          description: |
            Largest move from the close in the expected direction, also after
            the target, until the stop is reached or the window ends; for
            sideways the largest move in either direction.
        success:
          type: [boolean, "null"]
          description: The target was reached before the stop; for sideways, neither target was touched.
    BacktestSignalStats:
      type: object
      additionalProperties: false
      required: [count, successes, median_move]
      properties:
        count:
          type: integer
          minimum: 0
          description: Candles judged.
        successes:
          type: integer
          minimum: 0
        median_move:
          type: [number, "null"]
          format: double
          description: Median move to target over every judged candle, successful or not; null without candles.
    BacktestSymbolName:
      type: string
      minLength: 1
      maxLength: 32
      pattern: '^[A-Za-z0-9]+$'
      description: Market symbol, such as `BTCUSDT`.
    BacktestSummary:
      type: object
      additionalProperties: false
      required: [net_profit, max_drawdown, stats]
      description: Results of the strategy's trades.
      properties:
        net_profit:
          type: number
          format: double
          description: Compounded net return of the trades, the open one included; 0 without trades.
        max_drawdown:
          type: number
          format: double
          description: Largest fall of the equity from an earlier peak, as a fraction of that peak, measured at the close of every evaluated candle with an open trade valued there; 0 without falls.
        stats:
          $ref: "#/components/schemas/BacktestTradeStats"
          description: Statistics of the closed trades.
    BacktestTradeStats:
      type: object
      additionalProperties: false
      required: [trade_count, win_rate, profit_factor, average_trade, average_win, average_loss, average_bars, take_profit_exits, stop_loss_exits, exit_rule_exits]
      description: Statistics of net trade returns.
      properties:
        trade_count: { type: integer }
        take_profit_exits:
          type: integer
          description: Trades the take profit sold.
        stop_loss_exits:
          type: integer
          description: Trades the stop loss sold.
        exit_rule_exits:
          type: integer
          description: Trades the exit rule sold, including those the history ends with on their signal's candle.
        average_bars:
          type: [number, "null"]
          format: double
          description: Mean count of candles from the one the first buy filled at through the one the trade sold at; null without trades.
        win_rate:
          type: [number, "null"]
          format: double
          description: Share of positive returns, from 0 to 1; null without trades.
        profit_factor:
          type: [number, "null"]
          format: double
          description: Sum of positive returns over the sum of negative ones, as a positive number; null without losses.
        average_trade:
          type: [number, "null"]
          format: double
          description: Mean return; null without trades.
        average_win:
          type: [number, "null"]
          format: double
          description: Mean positive return; null without wins.
        average_loss:
          type: [number, "null"]
          format: double
          description: Mean negative return; null without losses.
    BacktestTrade:
      type: object
      additionalProperties: false
      required: [entry_time, entry_price, exit_time, exit_price, buys, open, net_return, fills, take_profit, stop_loss, exit_signal_time, exit_values]
      properties:
        entry_time:
          type: string
          format: date-time
          description: Open time of the candle the first buy filled at, at its open.
        entry_price:
          type: number
          format: double
          description: Average price of the buys.
        exit_time:
          type: string
          format: date-time
          description: Open time of the candle the trade sold at, at its open; for an open trade, of the last candle, whose close values it.
        exit_price: { type: number, format: double }
        buys:
          type: integer
          minimum: 1
          description: Buys of the trade, each of the same amount.
        open:
          type: boolean
          description: True for a trade the history ends before it sells.
        net_return:
          type: number
          format: double
          description: Return net of the fees on both sides.
        fills:
          type: array
          description: The filled buys, oldest first.
          items: { $ref: "#/components/schemas/BacktestFill" }
        take_profit:
          type: [number, "null"]
          format: double
          description: Take profit price fixed at the entry signal; null without one.
        stop_loss:
          type: [number, "null"]
          format: double
          description: Stop loss price fixed at the entry signal; null without one.
        exit_reason:
          type: string
          enum: [take_profit, stop_loss, exit]
          description: What sold the trade; absent for an open trade.
        exit_signal_time:
          type: [string, "null"]
          format: date-time
          description: Open time of the candle whose take profit, stop loss, or exit rule close signaled the sell; null for an open trade.
        exit_values:
          $ref: "#/components/schemas/BacktestValues"
          description: What the exit rule read at its signal; empty for other sells and open trades.
    BacktestFill:
      type: object
      additionalProperties: false
      required: [signal_time, time, price, values]
      properties:
        signal_time:
          type: string
          format: date-time
          description: Open time of the candle whose close signaled the buy.
        time:
          type: string
          format: date-time
          description: Open time of the candle the buy filled at, at its open.
        price: { type: number, format: double }
        values:
          $ref: "#/components/schemas/BacktestValues"
          description: What the entry rule read at the signal.
    BacktestValues:
      type: object
      description: |
        Values a rule read, named as its source writes them, such as `h_rsi`,
        `prev(h_rsi, 2)`, or `of("BTCUSDT", h_close)`; reads inside
        percentile windows and unknown values are left out.
      additionalProperties: { type: number, format: double }
    BacktestEquityPoint:
      type: object
      additionalProperties: false
      required: [time, equity]
      properties:
        time:
          type: string
          format: date-time
          description: Exit time of the trade.
        equity: { type: number, format: double }
    BacktestBaselines:
      type: object
      additionalProperties: false
      required: [buy_and_hold, dca]
      description: References over the same evaluated period, net of the same fees; null for a signal and for a short strategy.
      properties:
        buy_and_hold:
          type: [number, "null"]
          format: double
          description: Return from the open of the candle after the first evaluated candle to the close of the last; null when fewer than two candles are evaluated.
        dca:
          type: [number, "null"]
          format: double
          description: Return of buying the same amount at the open after every evaluated candle but the last, valued at the close of the last; null when fewer than two candles are evaluated.
    CandleHistoryLoadInput:
      type: object
      additionalProperties: false
      required: [symbols, intervals, depth]
      properties:
        symbols:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: { $ref: "#/components/schemas/BacktestSymbolName" }
        intervals:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items: { $ref: "#/components/schemas/CandleInterval" }
        depth:
          type: integer
          minimum: 2001
          maximum: 20000
          description: Closed candles to keep per coin and interval, beyond the 2,000 synchronization keeps.
    CandleHistoryLoadJob:
      type: object
      additionalProperties: false
      required: [status, symbols, intervals, depth, started_at, finished_at, items, history_changed, error]
      properties:
        status:
          type: string
          enum: [running, done, failed]
        symbols:
          type: array
          items: { type: string }
        intervals:
          type: array
          items: { $ref: "#/components/schemas/CandleInterval" }
        depth: { type: integer }
        started_at: { type: string, format: date-time }
        finished_at:
          type: [string, "null"]
          format: date-time
          description: Null while the job runs.
        items:
          type: array
          description: The stored history of every successfully completed coin and interval, by coin and then interval.
          items: { $ref: "#/components/schemas/CandleHistoryLoad" }
        history_changed:
          type: boolean
          description: The job committed candle changes, including partial loads that later failed.
        error:
          type: [string, "null"]
          description: A short reason when the job failed, such as a shutdown; the cause is in the server log. Null unless it failed.
    CandleHistoryLoad:
      type: object
      additionalProperties: false
      required: [symbol, interval, count, oldest_open_time, exhausted, not_ready]
      properties:
        symbol: { type: string }
        interval:
          $ref: "#/components/schemas/CandleInterval"
        count:
          type: integer
          description: Stored closed candles, at most 20,000; 0 before the coin's first synchronization.
        oldest_open_time:
          type: [string, "null"]
          format: date-time
          description: Open time of the oldest of them; null without candles.
        exhausted:
          type: boolean
          description: Binance has no older candles.
        not_ready:
          type: boolean
          description: Skipped because the coin has no synchronized candles on this interval yet, such as a coin listed this month on `1M`; synchronization backfills it first, and the job goes on with the other pairs.
    StrategyUpdate:
      type: object
      additionalProperties: false
      required: [name, signal, direction, expression, exit_expression, take_profit_expression, stop_loss_expression, min_market_cap_usd, max_market_cap_usd, target_ratio, window, message]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        signal: { $ref: "#/components/schemas/StrategySignal" }
        direction: { $ref: "#/components/schemas/Direction" }
        message: { $ref: "#/components/schemas/StrategyMessage" }
        exit_expression: { $ref: "#/components/schemas/StrategyExitExpression" }
        take_profit_expression: { $ref: "#/components/schemas/StrategyTakeProfitExpression" }
        stop_loss_expression: { $ref: "#/components/schemas/StrategyStopLossExpression" }
        min_market_cap_usd: { $ref: "#/components/schemas/StrategyMarketCapBound" }
        max_market_cap_usd: { $ref: "#/components/schemas/StrategyMarketCapBound" }
        target_ratio:
          oneOf:
            - $ref: "#/components/schemas/SignalTargetRatio"
            - type: "null"
        window:
          oneOf:
            - $ref: "#/components/schemas/SignalWindow"
            - type: "null"
        expression:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            CEL over strategy variables: comparisons (`>`, `>=`, `<`, `<=`) of
            arithmetic (`+`, `-`, `*`, `/`, parentheses) over variables and
            numbers, combined with `&&`, `||`, and `!`. `prev(x)` and
            `prev(x, n)` read `x` one or `n` closed candles earlier;
            `percentile(x, n, p)` is the nearest-rank `p`-th percentile of `x`
            over the `n` closed candles before the latest one;
            `crosses_above(a, b)` and `crosses_below(a, b)` compare with the
            previous candle. `of("BTCUSDT", x)` reads `x` of another coin,
            which must be in the administrator's favorites.
    StrategyInput:
      type: object
      additionalProperties: false
      required: [name, signal, direction, expression, exit_expression, take_profit_expression, stop_loss_expression, min_market_cap_usd, max_market_cap_usd, target_ratio, window, message, enabled]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        signal: { $ref: "#/components/schemas/StrategySignal" }
        direction: { $ref: "#/components/schemas/Direction" }
        expression: { type: string, minLength: 1, maxLength: 2000 }
        exit_expression: { $ref: "#/components/schemas/StrategyExitExpression" }
        take_profit_expression: { $ref: "#/components/schemas/StrategyTakeProfitExpression" }
        stop_loss_expression: { $ref: "#/components/schemas/StrategyStopLossExpression" }
        min_market_cap_usd: { $ref: "#/components/schemas/StrategyMarketCapBound" }
        max_market_cap_usd: { $ref: "#/components/schemas/StrategyMarketCapBound" }
        target_ratio:
          oneOf:
            - $ref: "#/components/schemas/SignalTargetRatio"
            - type: "null"
        window:
          oneOf:
            - $ref: "#/components/schemas/SignalWindow"
            - type: "null"
        message: { $ref: "#/components/schemas/StrategyMessage" }
        enabled: { type: boolean }
    StrategySignal:
      type: boolean
      description: |
        Whether the strategy is a signal, which buys nothing and only
        announces its entry signals, so its exit rule, take profit, and stop
        loss are empty. Fixed at creation:
        an update that changes it is refused.
    Direction:
      type: string
      enum: [long, short, sideways]
      description: |
        How a strategy trades, long or short, or the price move a signal
        expects after its entry signals: up, down, or sideways. A short
        strategy always has a take profit and a stop loss. Fixed at creation:
        an update that changes it is refused.
    SignalTargetRatio:
      type: integer
      enum: [2, 3, 4, 5]
      description: |
        A signal's target distance in stops, which its backtest judges each
        signal by: the stop lies the usual price move over the window against
        the expected move, and the target this many stops away in its
        direction. Required for a signal, null for a trading strategy.
    SignalWindow:
      type: integer
      enum: [3, 6, 12, 24]
      description: |
        The candles of its interval after each signal over which a signal's
        backtest judges it. Required for a signal, null for a trading
        strategy.
    StrategyMarketCapBound:
      type: [number, "null"]
      format: double
      exclusiveMinimum: 0
      description: |
        A bound, in USD and inclusive, of the current market caps of the coins
        the enabled strategy buys or the enabled signal announces; null leaves
        that side open. With either bound, coins of an unknown market cap buy
        or signal nothing. The range limits only buys and signals: open trades
        sell as usual, and backtests ignore it. The minimum must not exceed
        the maximum.
    StrategyExitExpression:
      type: string
      maxLength: 2000
      description: |
        Exit rule, a CEL expression like the entry rule that may also read the
        position variables, such as `pnl >= 5 || bars_held >= 24`; empty
        without an exit rule. A strategy without an exit rule, take profit,
        or stop loss never sells and buys at every entry signal.
    StrategyTakeProfitExpression:
      type: string
      maxLength: 2000
      description: |
        Take profit price, a CEL price expression evaluated at the close of
        the entry signal and fixed for the trade, such as `h_close * 1.05` or
        `h_bbands_20_2_2_upperband`: arithmetic and `abs`, `mod`, `min`,
        `max`, `prev`, `percentile`, and `of` over variables and numbers,
        reading the evaluated coin. A signal whose take profit is not above
        its close buys nothing. Empty without a take profit.
    StrategyStopLossExpression:
      type: string
      maxLength: 2000
      description: |
        Stop loss price, a CEL price expression like the take profit, such as
        `h_close - 2 * h_atr_14`. A signal whose stop loss is not between 0
        and its close buys nothing. Empty without a stop loss.
    StrategyMessage:
      type: string
      maxLength: 1000
      description: |
        Telegram alert text that follows the strategy name, the coin symbol,
        and the buy, the sell, or the signal in place of the rule and the
        values it read;
        empty keeps the generated text.
    StrategyValidationInput:
      type: object
      additionalProperties: false
      required: [expression]
      properties:
        expression: { type: string }
        kind:
          type: string
          enum: [entry, exit, price]
          default: entry
          description: Checks the expression as the entry rule, as the exit rule, which may read the position variables, or as a take profit or stop loss price.
    StrategyValidation:
      type: object
      additionalProperties: false
      required: [errors, missing_indicators]
      properties:
        errors:
          type: array
          items: { type: string }
        missing_indicators:
          type: array
          description: Indicators the expression reads that are not configured, in reading order; they need not be added.
          items: { $ref: "#/components/schemas/StrategyMissingIndicator" }
    StrategyMissingIndicator:
      type: object
      additionalProperties: false
      required: [interval, type, parameters, title]
      properties:
        interval: { $ref: "#/components/schemas/CandleInterval" }
        type: { type: string }
        parameters:
          type: object
          additionalProperties: true
          description: Canonical parameters with defaults filled in.
        title:
          type: string
          description: Table column title, such as `h-atr-100`.
    StrategyEnabled:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
    IndicatorTypeCatalog:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/IndicatorType" }
    IndicatorType:
      type: object
      additionalProperties: false
      required: [type, title, group, overlay, parameters, outputs]
      properties:
        type: { type: string }
        title: { type: string }
        group: { type: string }
        overlay:
          type: boolean
          description: Charts draw it over the candles; otherwise in a pane below.
        parameters:
          type: array
          items: { $ref: "#/components/schemas/IndicatorParameter" }
        outputs:
          type: array
          minItems: 1
          items: { type: string }
    IndicatorParameter:
      type: object
      additionalProperties: false
      required: [key, title, description, kind, default]
      properties:
        key: { type: string }
        title: { type: string }
        description: { type: string }
        kind:
          type: string
          enum: [integer, real, choice]
          description: "`choice` is an integer limited to `choices`; `minimum` and `maximum` bound the other kinds."
        default: { type: number, format: double }
        minimum: { type: number, format: double }
        maximum: { type: number, format: double }
        choices:
          type: array
          items: { $ref: "#/components/schemas/IndicatorChoice" }
    IndicatorChoice:
      type: object
      additionalProperties: false
      required: [value, title]
      properties:
        value: { type: integer }
        title: { type: string }
    ScannerIndicatorScale:
      type: object
      additionalProperties: false
      required: [levels]
      description: Optional value axis of a pane indicator; overlays have none.
      properties:
        min: { type: number, format: double }
        max: { type: number, format: double }
        levels:
          type: array
          items: { type: number, format: double }
    ScannerIndicatorInput:
      type: object
      additionalProperties: false
      required: [type, parameters, intervals]
      properties:
        type: { type: string, minLength: 1 }
        parameters:
          type: object
          additionalProperties: true
          description: Parameter values by key; omitted keys take their defaults.
        intervals:
          type: array
          minItems: 1
          maxItems: 4
          description: Intervals to add the indicator on, each once.
          items: { $ref: "#/components/schemas/ScannerIndicatorIntervalInput" }
        scale: { $ref: "#/components/schemas/ScannerIndicatorScale" }
    ScannerIndicatorBatch:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/ScannerIndicatorBatchItem" }
    ScannerIndicatorBatchItem:
      type: object
      additionalProperties: false
      required: [interval, type, parameters]
      properties:
        interval: { $ref: "#/components/schemas/CandleInterval" }
        type: { type: string, minLength: 1 }
        parameters:
          type: object
          additionalProperties: true
          description: Parameter values by key; omitted keys take their defaults.
    ScannerIndicatorIntervalInput:
      type: object
      additionalProperties: false
      required: [interval]
      properties:
        interval: { $ref: "#/components/schemas/CandleInterval" }
        show_in_table:
          type: boolean
          default: false
          description: Only indicators with one output can be table columns.
        show_in_chart:
          type: boolean
          default: false
          description: Whether the charts of the interval draw the indicator.
    ScannerIndicatorUpdate:
      type: object
      additionalProperties: false
      properties:
        show_in_table: { type: boolean, default: false }
        show_in_chart: { type: boolean, default: false }
        scale: { $ref: "#/components/schemas/ScannerIndicatorScale" }
    ScannerIndicatorOrder:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids:
          type: array
          description: Every indicator id once, in the new display order.
          items: { type: integer, format: int64 }
    ScannerIndicatorList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ScannerIndicator" }
    ScannerIndicator:
      type: object
      additionalProperties: false
      required: [id, interval, type, parameters, show_in_table, show_in_chart, scale, title, placement, outputs, strategies]
      properties:
        id: { type: integer, format: int64 }
        interval: { $ref: "#/components/schemas/CandleInterval" }
        type: { type: string }
        parameters:
          type: object
          additionalProperties: true
          description: Canonical parameters with defaults filled in.
        show_in_table: { type: boolean }
        show_in_chart: { type: boolean }
        scale: { $ref: "#/components/schemas/ScannerIndicatorScale" }
        title:
          type: string
          description: Table column title, such as `d-rsi`.
        placement:
          type: string
          enum: [overlay, pane]
        outputs:
          type: array
          items: { type: string }
        strategies:
          type: array
          description: Names of the strategies that read the indicator, which cannot be removed meanwhile.
          items: { type: string }
