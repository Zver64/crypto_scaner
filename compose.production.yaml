name: crypto-scanner

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]

# Point the backend image at the Compose PostgreSQL service; everything else
# comes from .env.
x-database-env: &database-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql

  migrate:
    <<: *hardening
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    # Migrations need only the database settings, not the whole .env.
    environment:
      <<: *database-env
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      DATABASE_URL: ${DATABASE_URL:-}
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/migrate"]
    command: ["up"]
    restart: "no"

  backend:
    <<: *hardening
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    env_file: .env
    environment:
      <<: *database-env
      HTTP_ADDRESS: 0.0.0.0:8080
      API_DOCS_ENABLED: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: ${BACKEND_STOP_GRACE_PERIOD:-30s}
    logging: *default-logging
    healthcheck:
      test: ["CMD", "/usr/local/bin/crypto-scanner", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  frontend:
    <<: *hardening
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    # nginx resolves the backend per request, so it only needs the network up.
    depends_on:
      - backend
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1:8081}:8080"

volumes:
  postgres-data:
