version: "2"
sql:
  - engine: postgresql
    # golang-migrate down migrations (*.down.sql) are ignored by sqlc.
    schema: migrations
    queries: internal/storage/postgres/queries
    gen:
      go:
        package: sqlc
        out: internal/storage/postgres/sqlc
        sql_package: pgx/v5
        overrides:
          - db_type: pg_catalog.numeric
            go_type: string
