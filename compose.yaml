name: crypto-scanner

x-app-environment: &app-environment
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

x-app-image: &app-image
  build:
    context: .
  image: crypto-scanner:local
  env_file:
    - .env
  environment:
    <<: *app-environment

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql

  migrate:
    <<: *app-image
    command: ["/usr/local/bin/migrate", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bootstrap-admin:
    <<: *app-image
    command: ["/usr/local/bin/bootstrap-admin"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  app:
    <<: *app-image
    environment:
      <<: *app-environment
      HTTP_ADDRESS: 0.0.0.0:8080
    ports:
      - "127.0.0.1:${HTTP_PORT}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      bootstrap-admin:
        condition: service_completed_successfully

volumes:
  postgres-data:
