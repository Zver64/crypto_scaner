openapi: 3.1.0
info:
  title: Crypto Scanner API
  version: 1.0.0
  description: |
    HTTP API for service health, cryptocurrency market analysis, and candle history.

    Live candles use the same-origin WebSocket endpoint `/api/v1/live/candles`.
    The client first sends `LiveCandleClientMessage` with type `authenticate`; the
    Telegram init data is never placed in the URL. After `authenticated`, the
    connection accepts dynamic `subscribe` and `unsubscribe` messages and emits
    `LiveCandleServerMessage` snapshots, updates, freshness changes, acknowledgements,
    and bounded errors. One connection may switch subscriptions without reconnecting.
servers:
  - url: /
tags:
  - name: Health
  - name: Analysis
  - name: Market Data
  - name: Favorites
  - name: Price Alerts
  - name: Administration
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Check whether the process is alive
      tags: [Health]
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: The process is running.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check whether required service dependencies are ready
      tags: [Health]
      parameters:
        - $ref: "#/components/parameters/RequestID"
      responses:
        "200":
          description: All required dependencies are ready.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: One or more required dependencies are unavailable.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /api/v1/analysis/instruments/{symbol}:
    post:
      operationId: analyzeInstrument
      summary: Analyze one active instrument
      tags: [Analysis]
      security:
        - telegramInitData: []
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Symbol"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstrumentAnalysisRequest"
      responses:
        "200":
          description: Instrument analysis result.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstrumentAnalysisResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/SymbolNotFound"
        "409":
          $ref: "#/components/responses/InsufficientData"
        "422":
          $ref: "#/components/responses/UnprocessableAnalysis"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/AnalysisUnavailable"
  /api/v1/analysis/market:
    post:
      operationId: analyzeMarket
      summary: Analyze active instruments in the market
      tags: [Analysis]
      security:
        - telegramInitData: []
      parameters:
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketAnalysisRequest"
      responses:
        "200":
          description: Market analysis result.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketAnalysisResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "422":
          $ref: "#/components/responses/UnprocessableAnalysis"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/AnalysisUnavailable"
  /api/v1/instruments/{symbol}/candles:
    get:
      operationId: listInstrumentCandles
      summary: List a chronological page of closed candles
      tags: [Market Data]
      security:
        - telegramInitData: []
      parameters:
        - $ref: "#/components/parameters/RequestID"
        - $ref: "#/components/parameters/Symbol"
        - name: interval
          in: query
          required: true
          description: Supported Binance Spot candle interval.
          schema:
            $ref: "#/components/schemas/CandleInterval"
        - name: before
          in: query
          required: false
          description: Return candles whose open time is before this cursor.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Maximum number of candles to return.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        "200":
          description: Candle page.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandlePageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/SymbolNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/chart/indicators:
    get:
      operationId: listChartIndicators
      summary: List the indicators charts of an interval request and how to draw them
      description: |
        Clients subscribe to live charts of the interval with each item's `type`
        and `parameters`, in this order, and draw the returned series as described
        here. The administrator configures the catalog, so it may be empty.
      tags: [Market Data]
      security: [{ telegramInitData: [] }]
      parameters:
        - name: interval
          in: query
          required: true
          schema: { $ref: "#/components/schemas/CandleInterval" }
      responses:
        "200":
          description: Chart indicator catalog.
          content: { application/json: { schema: { $ref: "#/components/schemas/ChartIndicatorCatalog" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/favorites:
    get:
      operationId: listFavorites
      tags: [Favorites]
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: Current user's favorites.
          content: { application/json: { schema: { $ref: "#/components/schemas/FavoritesResponse" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/favorites/{symbol}:
    put:
      operationId: addFavorite
      tags: [Favorites]
      security: [{ telegramInitData: [] }]
      parameters: [{ $ref: "#/components/parameters/Symbol" }]
      responses:
        "200":
          description: Favorite state.
          content: { application/json: { schema: { $ref: "#/components/schemas/Favorite" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/SymbolNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: removeFavorite
      tags: [Favorites]
      security: [{ telegramInitData: [] }]
      parameters:
        - { $ref: "#/components/parameters/Symbol" }
        - name: confirm_alerts
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "204": { description: "Favorite and, when confirmed, its alerts were removed." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/FavoriteNotFound" }
        "409": { $ref: "#/components/responses/FavoriteAlertsConflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/favorites/analysis:
    post:
      operationId: analyzeFavorites
      summary: Analyze the current user's active favorite instruments
      tags: [Favorites]
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarketAnalysisRequest" }
      responses:
        "200":
          description: Analysis results restricted to favorite instruments.
          content: { application/json: { schema: { $ref: "#/components/schemas/MarketAnalysisResponse" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "422": { $ref: "#/components/responses/UnprocessableAnalysis" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/AnalysisUnavailable" }
  /api/v1/instruments/{symbol}/alerts:
    get:
      operationId: listPriceAlerts
      tags: [Price Alerts]
      security: [{ telegramInitData: [] }]
      parameters: [{ $ref: "#/components/parameters/Symbol" }]
      responses:
        "200":
          description: Current user's active alerts for the instrument.
          content: { application/json: { schema: { $ref: "#/components/schemas/PriceAlertsResponse" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createPriceAlert
      tags: [Price Alerts]
      security: [{ telegramInitData: [] }]
      parameters: [{ $ref: "#/components/parameters/Symbol" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PriceAlertInput" } } }
      responses:
        "201":
          description: Alert created; the instrument is now a favorite.
          content: { application/json: { schema: { $ref: "#/components/schemas/PriceAlert" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/SymbolNotFound" }
        "409": { $ref: "#/components/responses/AlertConflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/alerts/{alert_id}:
    patch:
      operationId: updatePriceAlert
      tags: [Price Alerts]
      security: [{ telegramInitData: [] }]
      parameters: [{ $ref: "#/components/parameters/AlertID" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PriceAlertInput" } } }
      responses:
        "200":
          description: Updated alert.
          content: { application/json: { schema: { $ref: "#/components/schemas/PriceAlert" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/AlertNotFound" }
        "409": { $ref: "#/components/responses/AlertConflict" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deletePriceAlert
      tags: [Price Alerts]
      security: [{ telegramInitData: [] }]
      parameters: [{ $ref: "#/components/parameters/AlertID" }]
      responses:
        "204": { description: Alert deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/AlertNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Describe the authenticated user
      tags: [Administration]
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: Current user.
          content: { application/json: { schema: { $ref: "#/components/schemas/CurrentUser" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/admin/indicator-types:
    get:
      operationId: listIndicatorTypes
      summary: List every indicator the scanner can calculate
      description: Self-descriptions of the registered indicators, used to build the scanner indicator form.
      tags: [Administration]
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: Indicator types ordered by type.
          content: { application/json: { schema: { $ref: "#/components/schemas/IndicatorTypeCatalog" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AdministratorRequired" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/admin/scanner-indicators:
    get:
      operationId: listScannerIndicators
      summary: List the configured scanner indicators
      description: |
        Every configured indicator is calculated in the background, drawn on the
        charts of its interval, and shown as a market table column when
        `show_in_table` is set. Items are in display order, which orders the
        table columns and the chart indicators.
      tags: [Administration]
      security: [{ telegramInitData: [] }]
      responses:
        "200":
          description: Configured indicators.
          content: { application/json: { schema: { $ref: "#/components/schemas/ScannerIndicatorList" } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AdministratorRequired" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createScannerIndicator
      summary: Add a scanner indicator
      tags: [Administration]
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ScannerIndicatorInput" } } }
      responses:
        "201":
          description: Indicator added.
          content: { application/json: { schema: { $ref: "#/components/schemas/ScannerIndicator" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AdministratorRequired" }
        "409": { $ref: "#/components/responses/ScannerIndicatorConflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/admin/scanner-indicator-order:
    put:
      operationId: reorderScannerIndicators
      summary: Set the display order of the scanner indicators
      tags: [Administration]
      security: [{ telegramInitData: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ScannerIndicatorOrder" } } }
      responses:
        "200":
          description: Indicators in the new order.
          content: { application/json: { schema: { $ref: "#/components/schemas/ScannerIndicatorList" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AdministratorRequired" }
        "404": { $ref: "#/components/responses/ScannerIndicatorNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/admin/scanner-indicators/{indicator_id}:
    patch:
      operationId: updateScannerIndicator
      summary: Change the table visibility and pane scale of a scanner indicator
      tags: [Administration]
      security: [{ telegramInitData: [] }]
      parameters: [{ $ref: "#/components/parameters/ScannerIndicatorID" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ScannerIndicatorUpdate" } } }
      responses:
        "200":
          description: Updated indicator.
          content: { application/json: { schema: { $ref: "#/components/schemas/ScannerIndicator" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AdministratorRequired" }
        "404": { $ref: "#/components/responses/ScannerIndicatorNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteScannerIndicator
      summary: Remove a scanner indicator
      tags: [Administration]
      security: [{ telegramInitData: [] }]
      parameters: [{ $ref: "#/components/parameters/ScannerIndicatorID" }]
      responses:
        "204": { description: Indicator removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AdministratorRequired" }
        "404": { $ref: "#/components/responses/ScannerIndicatorNotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
components:
  securitySchemes:
    telegramInitData:
      type: apiKey
      in: header
      name: Authorization
      description: Telegram Mini App init data prefixed with `tma `.
  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: Optional caller-provided correlation ID. Unsafe values are replaced.
      schema:
        type: string
    Symbol:
      name: symbol
      in: path
      required: true
      description: Market symbol.
      schema:
        type: string
        minLength: 1
        maxLength: 32
    AlertID:
      name: alert_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ScannerIndicatorID:
      name: indicator_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  headers:
    RequestID:
      description: Correlation ID assigned to the request.
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: The request is malformed or contains an unsupported argument.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: Telegram authentication is missing, invalid, or expired.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AccessDenied:
      description: The authenticated Telegram user is not enabled.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SymbolNotFound:
      description: The symbol is unknown or inactive.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InsufficientData:
      description: The requested analysis requires more candle history.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableAnalysis:
      description: An instrument could not be resolved for analysis.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: An unexpected server error occurred.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    FavoriteNotFound:
      description: Favorite is not owned by the current user.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    AlertNotFound:
      description: Alert is not owned by the current user.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    FavoriteAlertsConflict:
      description: Confirmation is required because alerts exist.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    AlertConflict:
      description: Duplicate target or per-instrument alert limit.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    AdministratorRequired:
      description: The user is not enabled or is not the scanner administrator.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    ScannerIndicatorNotFound:
      description: The scanner indicator does not exist.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    ScannerIndicatorConflict:
      description: The interval already has this indicator or its charts draw the maximum number of indicators.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    AnalysisUnavailable:
      description: Required market data or market-capitalization data is unavailable.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Favorite:
      type: object
      additionalProperties: false
      required: [symbol, base_asset, quote_asset, active, alert_count, created_at]
      properties:
        symbol: { type: string }
        base_asset: { type: string }
        quote_asset: { type: string }
        active: { type: boolean }
        alert_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
    FavoritesResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Favorite" } }
    PriceAlertInput:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target:
          type: string
          pattern: '^(0|[1-9][0-9]{0,19})(\.[0-9]{1,18})?$'
          maxLength: 39
    PriceAlert:
      type: object
      additionalProperties: false
      required: [id, symbol, target, version, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        symbol: { type: string }
        target: { type: string }
        version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PriceAlertsResponse:
      type: object
      additionalProperties: false
      required: [items, count, limit]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PriceAlert" } }
        count: { type: integer, minimum: 0 }
        limit: { type: integer, const: 10 }
    LivenessResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          additionalProperties: false
          required: [database, migrations, market_sync]
          properties:
            database:
              $ref: "#/components/schemas/ReadinessCheck"
            migrations:
              $ref: "#/components/schemas/ReadinessCheck"
            market_sync:
              $ref: "#/components/schemas/ReadinessCheck"
    ReadinessCheck:
      type: string
      enum: [ok, unavailable, missing]
    InstrumentAnalysisRequest:
      x-go-name: InstrumentAnalysisRequest
      type: object
      additionalProperties: false
      required: [criteria]
      properties:
        criteria:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CriterionRequest"
    MarketAnalysisRequest:
      x-go-name: MarketAnalysisRequest
      type: object
      additionalProperties: false
      required: [criteria]
      properties:
        criteria:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CriterionRequest"
        limit:
          description: Maximum instruments to select. Zero or omission means no limit.
          type: integer
          minimum: 0
          maximum: 100
        sort:
          $ref: "#/components/schemas/MarketSort"
    CriterionRequest:
      type: object
      additionalProperties: false
      required: [key, name, label, parameters]
      properties:
        key:
          type: string
        name:
          type: string
        label:
          type: string
        parameters:
          type: object
          additionalProperties: true
    MarketSort:
      type: object
      additionalProperties: false
      required: [field, direction]
      properties:
        field:
          type: string
          enum: [market_cap_usd]
        direction:
          type: string
          enum: [asc, desc]
    Evaluation:
      type: object
      additionalProperties: false
      required: [key, name, label, matched, metrics, candle_count, from, to]
      properties:
        key:
          type: string
        name:
          type: string
        label:
          type: string
        matched:
          type: boolean
        metrics:
          type: object
          additionalProperties:
            type: number
            format: double
        candle_count:
          type: integer
          minimum: 0
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    Warning:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    InstrumentAnalysisResponse:
      type: object
      additionalProperties: false
      required: [symbol, matched, evaluations, warnings]
      properties:
        symbol:
          type: string
        matched:
          type: boolean
        evaluations:
          type: array
          items:
            $ref: "#/components/schemas/Evaluation"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
    PriceHistoryWindow:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    MarketAnalysisItem:
      type: object
      additionalProperties: false
      required: [symbol, matched, evaluations]
      properties:
        symbol:
          type: string
        matched:
          type: boolean
        evaluations:
          type: array
          items:
            $ref: "#/components/schemas/Evaluation"
    MarketTable:
      description: |
        The table clients render for an analysis, as configured by the backend:
        columns in display order, how each cell is shown, which columns are
        sortable, and the default sort. Columns that show criterion results read
        them by criterion and candle unit, independent of criterion keys.
      type: object
      additionalProperties: false
      required: [columns, default_sort, rows]
      properties:
        columns:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TableColumn"
        default_sort:
          $ref: "#/components/schemas/TableSort"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/TableRow"
    TableColumn:
      type: object
      additionalProperties: false
      required: [id, title, kind, sortable]
      properties:
        id:
          type: string
        title:
          type: string
        kind:
          $ref: "#/components/schemas/TableColumnKind"
        sortable:
          description: Sortable columns are numeric and sorted by the cell `value`.
          type: boolean
    TableColumnKind:
      description: |
        How a cell is rendered and which cell field it reads. `text` and
        `favorite` use the row symbol; `sparkline` reads `series` over the
        response `price_history_window`; `link` reads `url`; every other kind
        reads `value`.
      type: string
      enum: [text, usd_compact, range_percent, oscillator, percent_change, sparkline, link, favorite, count, number]
    TableSort:
      type: object
      additionalProperties: false
      required: [column, direction]
      properties:
        column:
          type: string
        direction:
          type: string
          enum: [asc, desc]
    TableRow:
      type: object
      additionalProperties: false
      required: [symbol, cells]
      properties:
        symbol:
          type: string
        cells:
          description: Cells keyed by column id. Columns of kind `text` and `favorite` have no cell.
          type: object
          additionalProperties:
            $ref: "#/components/schemas/TableCell"
    TableCell:
      description: Holds the field its column kind reads; the field is omitted when its value is unavailable.
      type: object
      additionalProperties: false
      properties:
        value:
          type: number
          format: double
        series:
          type: array
          minItems: 169
          maxItems: 169
          items:
            type: [number, "null"]
            format: double
        url:
          type: string
    UnresolvedInstrument:
      type: object
      additionalProperties: false
      required: [symbol, code, message]
      properties:
        symbol:
          type: string
        code:
          type: string
          enum: [mapping_conflict, mapping_not_found, mapping_provider_unavailable, market_cap_missing]
        message:
          type: string
    InsufficientDataInstrument:
      description: An instrument skipped because a criterion lacked closed candle history.
      type: object
      additionalProperties: false
      required: [symbol, unit, required, available]
      properties:
        symbol:
          type: string
        unit:
          type: string
          enum: [days, hours]
        required:
          type: integer
          minimum: 1
        available:
          type: integer
          minimum: 0
    MarketAnalysisResponse:
      type: object
      additionalProperties: false
      required:
        - price_history_window
        - matched_count
        - analyzed_count
        - insufficient_data_count
        - insufficient_data
        - items
        - unresolved
        - warnings
        - table
      properties:
        table:
          $ref: "#/components/schemas/MarketTable"
        price_history_window:
          $ref: "#/components/schemas/PriceHistoryWindow"
        matched_count:
          type: integer
          minimum: 0
        analyzed_count:
          type: integer
          minimum: 0
        insufficient_data_count:
          type: integer
          minimum: 0
        insufficient_data:
          type: array
          items:
            $ref: "#/components/schemas/InsufficientDataInstrument"
        items:
          type: array
          items:
            $ref: "#/components/schemas/MarketAnalysisItem"
        unresolved:
          type: array
          items:
            $ref: "#/components/schemas/UnresolvedInstrument"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
    CandleInterval:
      type: string
      enum: [1h, 1d, 1w, 1M]
    Candle:
      type: object
      additionalProperties: false
      required: [open_time, close_time, open, high, low, close, volume, quote_asset_volume, trade_count]
      properties:
        open_time:
          type: string
          format: date-time
        close_time:
          type: string
          format: date-time
        open:
          type: number
          format: double
        high:
          type: number
          format: double
        low:
          type: number
          format: double
        close:
          type: number
          format: double
        volume:
          type: number
          format: double
        quote_asset_volume:
          type: number
          format: double
        trade_count:
          type: integer
          format: int64
          minimum: 0
    CandlePageResponse:
      type: object
      additionalProperties: false
      required: [symbol, interval, candles, has_more]
      properties:
        symbol:
          type: string
        interval:
          $ref: "#/components/schemas/CandleInterval"
        candles:
          type: array
          items:
            $ref: "#/components/schemas/Candle"
        has_more:
          type: boolean
        next_before:
          type: [string, "null"]
          format: date-time
    IndicatorConfig:
      type: object
      additionalProperties: false
      required: [type, parameters]
      properties:
        type:
          type: string
          minLength: 1
        parameters:
          type: object
          additionalProperties: true
    IndicatorPoint:
      type: object
      additionalProperties: false
      required: [time, value]
      properties:
        time:
          type: string
          format: date-time
        value:
          type: number
          format: double
    IndicatorSeries:
      type: object
      additionalProperties: false
      required: [name, points]
      properties:
        name:
          type: string
        points:
          type: array
          items:
            $ref: "#/components/schemas/IndicatorPoint"
    ChartIndicatorResult:
      type: object
      additionalProperties: false
      required: [type, parameters, series]
      properties:
        type:
          type: string
        parameters:
          type: object
          additionalProperties: true
        series:
          type: array
          items:
            $ref: "#/components/schemas/IndicatorSeries"
    ChartIndicatorCatalog:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ChartIndicatorDefinition" }
    ChartIndicatorDefinition:
      type: object
      additionalProperties: false
      required: [id, type, parameters, placement, lines]
      properties:
        id:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
        parameters:
          type: object
          additionalProperties: true
        placement:
          type: string
          enum: [overlay, pane]
          description: "`overlay` draws over the candles on their price scale; `pane` draws in its own pane below."
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ChartIndicatorLine" }
        scale:
          $ref: "#/components/schemas/ChartIndicatorScale"
    ChartIndicatorLine:
      type: object
      additionalProperties: false
      required: [output, title, color]
      properties:
        output:
          type: string
          description: Name of the calculated series drawn by this line.
        title:
          type: string
        color:
          type: string
          description: Client theme color token, for example `yellow.5`.
    ChartIndicatorScale:
      type: object
      additionalProperties: false
      required: [levels]
      description: Value axis of a pane indicator; clients derive the value precision from the values.
      properties:
        min:
          type: number
          format: double
        max:
          type: number
          format: double
        levels:
          type: array
          items: { $ref: "#/components/schemas/ChartIndicatorLevel" }
    ChartIndicatorLevel:
      type: object
      additionalProperties: false
      required: [value, title]
      properties:
        value:
          type: number
          format: double
        title:
          type: string
    ChartPageResponse:
      type: object
      additionalProperties: false
      required: [symbol, interval, candles, indicators, has_more]
      properties:
        symbol:
          type: string
        interval:
          $ref: "#/components/schemas/CandleInterval"
        candles:
          type: array
          items:
            $ref: "#/components/schemas/Candle"
        indicators:
          type: array
          items:
            $ref: "#/components/schemas/ChartIndicatorResult"
        has_more:
          type: boolean
        next_before:
          type: [string, "null"]
          format: date-time
    LiveCandleClientMessage:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [authenticate, subscribe, unsubscribe]
        init_data:
          type: string
          minLength: 1
        symbol:
          type: string
          minLength: 1
          maxLength: 32
        interval:
          $ref: "#/components/schemas/CandleInterval"
        limit:
          type: integer
          minimum: 1
          maximum: 2000
          description: Closed-candle range for this chart subscription; subscribing again with a larger value extends the range.
        indicators:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/IndicatorConfig"
    LiveCandleServerMessage:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [authenticated, subscribed, unsubscribed, snapshot, update, status, error]
        symbol:
          type: string
        interval:
          $ref: "#/components/schemas/CandleInterval"
        chart:
          description: >-
            In a snapshot, the complete closed-candle range plus the current candle,
            with indicators calculated over the entire range. In an update, only the
            current candle and indicator points from its open time; it applies solely
            on top of the message with the preceding version.
          $ref: "#/components/schemas/ChartPageResponse"
        version:
          type: integer
          format: int64
          description: Increases by one with every snapshot or update of this subscription.
        freshness:
          type: string
          enum: [waiting, fresh, stale, recovering]
        code:
          type: string
          enum: [unauthenticated, access_denied, invalid_message, invalid_argument, symbol_not_found, rate_limited, subscription_limit, unavailable, slow_client]
        message:
          type: string
    APIError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - access_denied
            - administrator_required
            - alert_limit
            - alert_not_found
            - duplicate_target
            - favorite_has_alerts
            - favorite_not_found
            - insufficient_data
            - internal_error
            - invalid_argument
            - mapping_conflict
            - mapping_not_found
            - mapping_provider_unavailable
            - market_cap_missing
            - market_cap_unavailable
            - market_data_unavailable
            - scanner_indicator_exists
            - scanner_indicator_limit
            - scanner_indicator_not_found
            - symbol_not_found
            - unauthenticated
        message:
          type: string
        details: {}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, request_id]
      properties:
        error:
          $ref: "#/components/schemas/APIError"
        request_id:
          type: string
    CurrentUser:
      type: object
      additionalProperties: false
      required: [administrator]
      properties:
        administrator:
          type: boolean
          description: Whether the user manages the global scanner settings.
    IndicatorTypeCatalog:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/IndicatorType" }
    IndicatorType:
      type: object
      additionalProperties: false
      required: [type, title, group, overlay, parameters, outputs]
      properties:
        type: { type: string }
        title: { type: string }
        group: { type: string }
        overlay:
          type: boolean
          description: Charts draw it over the candles; otherwise in a pane below.
        parameters:
          type: array
          items: { $ref: "#/components/schemas/IndicatorParameter" }
        outputs:
          type: array
          minItems: 1
          items: { type: string }
    IndicatorParameter:
      type: object
      additionalProperties: false
      required: [key, title, description, kind, default]
      properties:
        key: { type: string }
        title: { type: string }
        description: { type: string }
        kind:
          type: string
          enum: [integer, real, choice]
          description: "`choice` is an integer limited to `choices`; `minimum` and `maximum` bound the other kinds."
        default: { type: number, format: double }
        minimum: { type: number, format: double }
        maximum: { type: number, format: double }
        choices:
          type: array
          items: { $ref: "#/components/schemas/IndicatorChoice" }
    IndicatorChoice:
      type: object
      additionalProperties: false
      required: [value, title]
      properties:
        value: { type: integer }
        title: { type: string }
    ScannerIndicatorScale:
      type: object
      additionalProperties: false
      required: [levels]
      description: Optional value axis of a pane indicator; overlays have none.
      properties:
        min: { type: number, format: double }
        max: { type: number, format: double }
        levels:
          type: array
          items: { type: number, format: double }
    ScannerIndicatorInput:
      type: object
      additionalProperties: false
      required: [interval, type, parameters, show_in_table]
      properties:
        interval: { $ref: "#/components/schemas/CandleInterval" }
        type: { type: string, minLength: 1 }
        parameters:
          type: object
          additionalProperties: true
          description: Parameter values by key; omitted keys take their defaults.
        show_in_table:
          type: boolean
          description: Only indicators with one output can be table columns.
        scale: { $ref: "#/components/schemas/ScannerIndicatorScale" }
    ScannerIndicatorUpdate:
      type: object
      additionalProperties: false
      required: [show_in_table]
      properties:
        show_in_table: { type: boolean }
        scale: { $ref: "#/components/schemas/ScannerIndicatorScale" }
    ScannerIndicatorOrder:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids:
          type: array
          description: Every indicator id once, in the new display order.
          items: { type: integer, format: int64 }
    ScannerIndicatorList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ScannerIndicator" }
    ScannerIndicator:
      type: object
      additionalProperties: false
      required: [id, interval, type, parameters, show_in_table, scale, title, placement, outputs]
      properties:
        id: { type: integer, format: int64 }
        interval: { $ref: "#/components/schemas/CandleInterval" }
        type: { type: string }
        parameters:
          type: object
          additionalProperties: true
          description: Canonical parameters with defaults filled in.
        show_in_table: { type: boolean }
        scale: { $ref: "#/components/schemas/ScannerIndicatorScale" }
        title:
          type: string
          description: Table column title, such as `d-rsi`.
        placement:
          type: string
          enum: [overlay, pane]
        outputs:
          type: array
          items: { type: string }
